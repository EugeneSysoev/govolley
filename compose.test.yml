services:
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_USER: govolley_test
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: govolley_test
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govolley_test -d govolley_test"]
      interval: 2s
      timeout: 3s
      retries: 20
